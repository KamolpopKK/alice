name: Promote server image

# :latest follows the latest *published* release. It re-tags the digest that the
# release workflow already pushed as :<version>; nothing is rebuilt. Draft and pre-releases never move it.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  latest:
    name: ghcr.io …:latest → this release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag :latest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${TAG#v}"
          docker buildx imagetools inspect "$IMAGE:latest"
