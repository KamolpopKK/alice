# Production entry point: docker compose up -d
# Required: ALICE_PUBLIC_URL (e.g. https://alice.example.com). Put secrets in .env, never commit it.
services:
  alice:
    # prebuilt multi-arch image (amd64, arm64); pin with ALICE_VERSION. `docker compose build` builds it from a checkout
    image: ghcr.io/kamolpopkk/alice:${ALICE_VERSION:-0.2.0}
    build: .
    restart: unless-stopped
    ports:
      - "${ALICE_BIND:-127.0.0.1}:${ALICE_HTTP_PORT:-8080}:8080"
    environment:
      ALICE_PUBLIC_URL: ${ALICE_PUBLIC_URL:?Set ALICE_PUBLIC_URL to the URL users open}
      ALICE_BOOTSTRAP_TOKEN: ${ALICE_BOOTSTRAP_TOKEN:-}
      ALICE_ALLOW_INSECURE_HTTP: ${ALICE_ALLOW_INSECURE_HTTP:-false}
      ALICE_TRUST_PROXY: ${ALICE_TRUST_PROXY:-false}
      ALICE_LOG_LEVEL: ${ALICE_LOG_LEVEL:-info}
    volumes:
      - alice-data:/data

  # Optional automatic HTTPS: set ALICE_DOMAIN (DNS → this host, ports 80 and 443 open), then
  #   docker compose --profile https up -d
  # Also set ALICE_PUBLIC_URL=https://<domain> and ALICE_TRUST_PROXY=true in .env (see docs/operations.md).
  caddy:
    image: caddy:2.11-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [alice]
    # ไม่ใช้ ${ALICE_DOMAIN:?} เพราะ Compose ตรวจตัวแปรทั้งไฟล์ แม้ profile นี้ไม่ได้เปิด
    command: ['sh', '-c', 'if [ -z "$$ALICE_DOMAIN" ]; then echo "alice: set ALICE_DOMAIN in .env to use the https profile" >&2; exit 64; fi; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile']
    environment:
      ALICE_DOMAIN: ${ALICE_DOMAIN:-}
    ports:
      - "${ALICE_HTTPS_REDIRECT_PORT:-80}:80"
      - "${ALICE_HTTPS_PORT:-443}:443"
      - "${ALICE_HTTPS_PORT:-443}:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  alice-data:
  caddy-data:
  caddy-config:

configs:
  caddyfile:
    # Caddy gets and renews the certificate for ALICE_DOMAIN and forwards to Alice. Live updates
    # (text/event-stream) are flushed immediately; no compression, so nothing buffers them.
    content: |
      {$$ALICE_DOMAIN} {
      	reverse_proxy alice:8080
      }
